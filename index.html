<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening in Word...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --btn-bg: rgba(43, 87, 154, 0.85);
      --btn-hover: rgba(30, 63, 115, 0.92);
      --btn-text: #ffffff;
      --btn-border: rgba(0, 0, 0, 0.25);
      --btn-inset-top: inset 0 1px 1px rgba(255, 255, 255, 0.55);
      --btn-inset-bottom: inset 0 -2px 4px rgba(0, 0, 0, 0.25);
      --glow-primary: radial-gradient(circle, rgba(43, 87, 154, 0.14) 0%, rgba(59, 130, 246, 0.06) 45%, transparent 72%);
      --glow-secondary: radial-gradient(circle, rgba(14, 165, 233, 0.10) 0%, rgba(99, 102, 241, 0.05) 48%, transparent 74%);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a1b2e;
        --text: #f8fafc;
        --muted: #cbd5e1;
        --btn-bg: rgba(59, 115, 196, 0.82);
        --btn-hover: rgba(82, 136, 216, 0.9);
        --btn-text: #ffffff;
        --btn-border: rgba(0, 0, 0, 0.25);
        --btn-inset-top: inset 0 1px 1px rgba(255, 255, 255, 0.45);
        --btn-inset-bottom: inset 0 -2px 4px rgba(0, 0, 0, 0.25);
        --glow-primary: radial-gradient(circle, rgba(56, 189, 248, 0.18) 0%, rgba(59, 115, 196, 0.10) 45%, transparent 72%);
        --glow-secondary: radial-gradient(circle, rgba(99, 102, 241, 0.14) 0%, rgba(20, 184, 166, 0.07) 48%, transparent 74%);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      position: relative;
      overflow-x: hidden;
      margin: 0;
      padding: 80px clamp(16px, 4vw, 32px) 32px;
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--text);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: clamp(0.95rem, 1.2vw + 0.65rem, 1.0625rem);
      line-height: 1.6;
      text-align: center;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      pointer-events: none;
      filter: blur(52px);
      z-index: 0;
    }

    body::before {
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      width: min(760px, 120vw);
      height: min(520px, 75vh);
      background: var(--glow-primary);
    }

    body::after {
      top: 16px;
      left: 68%;
      transform: translateX(-25%);
      width: min(640px, 100vw);
      height: min(460px, 65vh);
      background: var(--glow-secondary);
    }

    h2, p, .btn {
      position: relative;
      z-index: 1;
    }

    h2 {
      margin: 0 auto 12px;
      max-width: 26ch;
      font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: clamp(1.375rem, 2.5vw + 0.85rem, 2rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--text);
    }

    p {
      margin: 0 auto;
      max-width: 52ch;
      font-size: clamp(0.9375rem, 1vw + 0.65rem, 1.0625rem);
      line-height: 1.6;
      color: var(--muted);
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 11px 22px;
      background-color: var(--btn-bg);
      color: var(--btn-text);
      text-decoration: none;
      border: 1px solid var(--btn-border);
      border-radius: 12px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: var(--btn-inset-top), var(--btn-inset-bottom);
      font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: clamp(0.875rem, 0.8vw + 0.65rem, 0.975rem);
      font-weight: 600;
      letter-spacing: -0.01em;
      transition: background-color 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
    }

    .btn:hover {
      background-color: var(--btn-hover);
    }

    .btn:active {
      transform: translateY(1px);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.25);
    }
  </style>
</head>
<body>
  <h2 id="statusTitle">Launching Microsoft Word...</h2>
  <p id="statusMessage">If a prompt appears, choose to open Word. This page will update in 10 seconds.</p>
  <a id="fallbackLink" class="btn" href="#" style="display: none;">Open in Word</a>

  <script>
    const params = new URLSearchParams(window.location.search);
    const fileUrl = params.get('file');
    const allowedDomain = "https://prefchem365.sharepoint.com/";

    const titleEl = document.getElementById('statusTitle');
    const msgEl = document.getElementById('statusMessage');
    const linkEl = document.getElementById('fallbackLink');

    if (fileUrl && fileUrl.startsWith(allowedDomain)) {
      const wordUri = "ms-word:ofe|u|" + fileUrl;
      linkEl.href = wordUri;
      linkEl.style.display = "inline-block";

      // 1. Trigger the Word desktop protocol
      window.location.href = wordUri;

      // 2. After 10 seconds, update instructions and keep the fallback button available
      setTimeout(() => {
        titleEl.textContent = "Microsoft Word launch attempted";
        msgEl.textContent = "If Word did not open or you missed the prompt, click the button below. You may close this tab when finished.";
      }, 10000);
    } else {
      titleEl.textContent = "Invalid or unauthorized document link.";
      msgEl.textContent = "The requested file URL is missing or outside the allowed SharePoint domain.";
      linkEl.style.display = "none";
    }
  </script>
</body>
</html>
